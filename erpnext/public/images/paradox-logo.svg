    <circle cx="32" cy="28" r="1.5" fill="#38BDF8"/>
  </g>

  <!-- Brand Typography -->
  <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">PARADOX<tspan fill="#38BDF8">-BD</tspan></text>
  
  <!-- Subtitle Badge: Unified Pill -->
  <rect x="60" y="38" width="132" height="15" rx="4" fill="rgba(99, 102, 241, 0.16)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="0.8"/>
  <text x="67" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#818CF8">ENTERPRISE <tspan fill="#38BDF8" font-weight="700">SYSTEM</tspan></text>
