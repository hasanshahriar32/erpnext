<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paradoxGrad" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="20" y1="20" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="0" y="0" width="60" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Geometric P Emblem -->
  <g filter="url(#subtleShadow)">
    <rect x="10" y="10" width="40" height="40" rx="12" fill="#0B0F19"/>
    <rect x="10.5" y="10.5" width="39" height="39" rx="11.5" stroke="url(#paradoxGrad)" stroke-width="1.2"/>
    
    <!-- Stylized Geometric P Mark -->
    <path d="M22 39V21H32C35.866 21 39 24.134 39 28C39 31.866 35.866 35 32 35H27V39H22Z" fill="url(#paradoxGrad)"/>
    <path d="M26 25V31H32C33.6569 31 35 29.6569 35 28C35 26.3431 33.6569 25 32 25H26Z" fill="#0B0F19"/>
    <circle cx="32" cy="28" r="1.5" fill="#38BDF8"/>
  </g>

  <!-- Brand Typography -->
  <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">PARADOX<tspan fill="#38BDF8">-BD</tspan></text>
  
  <!-- Subtitle Badge -->
  <rect x="62" y="37" width="38" height="13" rx="3" fill="rgba(99, 102, 241, 0.15)"/>
  <rect x="62" y="37" width="38" height="13" rx="3" stroke="rgba(99, 102, 241, 0.4)" stroke-width="0.8"/>
  <text x="66" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" fill="#818CF8">ENTERPRISE</text>
  <text x="106" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" letter-spacing="0.5" fill="#94A3B8">ERP SYSTEM</text>
