<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paradoxGradLight" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="subtleShadowLight" x="0" y="0" width="60" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4F46E5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Modern Geometric P Emblem -->
  <g filter="url(#subtleShadowLight)">
    <rect x="10" y="10" width="40" height="40" rx="12" fill="#0F172A"/>
    <rect x="10.5" y="10.5" width="39" height="39" rx="11.5" stroke="url(#paradoxGradLight)" stroke-width="1.2"/>
    
    <!-- Stylized Geometric P Mark -->
    <path d="M22 39V21H32C35.866 21 39 24.134 39 28C39 31.866 35.866 35 32 35H27V39H22Z" fill="url(#paradoxGradLight)"/>
    <path d="M26 25V31H32C33.6569 31 35 29.6569 35 28C35 26.3431 33.6569 25 32 25H26Z" fill="#0F172A"/>
    <circle cx="32" cy="28" r="1.5" fill="#38BDF8"/>
  </g>

  <!-- Brand Typography: High contrast dark text for light mode -->
  <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="1.2" fill="#0F172A">PARADOX<tspan fill="#0284C7">-BD</tspan></text>
  
  <!-- Subtitle Badge: Unified Pill -->
  <rect x="60" y="38" width="132" height="15" rx="4" fill="rgba(79, 70, 229, 0.08)" stroke="rgba(79, 70, 229, 0.3)" stroke-width="0.8"/>
  <text x="67" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#4F46E5">ENTERPRISE <tspan fill="#0284C7" font-weight="700">SYSTEM</tspan></text>
</svg>
