services:
  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 280M
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: "${DB_PORT:-11240}"
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g db_ssl 1;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: "${DB_PORT:-11240}"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "Timed out waiting for sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json configured successfully";
        if [ -d "sites/${SITE_NAME:-erp.nirog.me}" ]; then
          echo "Site ${SITE_NAME:-erp.nirog.me} already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=${ADMIN_PASSWORD:-grammarpro} --db-root-username=${DB_USER:-avnadmin} --db-root-password=${DB_PASSWORD} --install-app erpnext --set-default ${SITE_NAME:-erp.nirog.me};
        fi;
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: "${DB_PORT:-11240}"

  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    depends_on:
      - websocket
      - backend
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 120M
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.nirog.me}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PORT:-8085}:8080"

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 120M
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 120M
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 32M
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 32M

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 120M
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.34.2}
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 80M
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
